name: fokusinaja
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  audioplayers: ^6.1.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Pastikan daftar assets ini sejajar (4 spasi) dan tidak ada baris kosong di tengahnya
  assets:
    - assets/images/
    - assets/music/
    - assets/icon/

# Konfigurasi untuk mengganti ikon aplikasi
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21